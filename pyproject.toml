[project]
name = "flashbpe"
version = "0.1.0"
description = "A Rust implementation of a Byte Pair Encoding tokenizer, with Python bindings via PyO3"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# No required runtime dependencies — the compiled extension is self-contained.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

# Tells pip/build to use maturin as the build backend for this package.
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Only enable the extension-module feature for Python builds; `cargo test`
# builds without it so a plain Rust test binary can link successfully.
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = "test_*.py"
markers = [
    "slow: marks tests as slow (use -m 'not slow' to skip)",
]
